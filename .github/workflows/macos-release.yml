name: macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to create or update"
        required: false
        default: head
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'head' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS release bundle
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'head' }}
      PRERELEASE: ${{ inputs.prerelease || false }}

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install cmake ninja qt llvm lld sevenzip xcodegen vulkan-headers

          llvm_prefix="$(brew --prefix llvm)"
          test -x "$llvm_prefix/bin/clang"
          test -x "$llvm_prefix/bin/clang++"
          test -f "$llvm_prefix/lib/c++/libc++.1.dylib"
          test -f "$llvm_prefix/lib/c++/libc++abi.1.dylib"
          test -f "$llvm_prefix/lib/unwind/libunwind.1.dylib"

          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"
          echo "QT_ROOT=$(brew --prefix qt)" >> "$GITHUB_ENV"
          echo "CC=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$llvm_prefix/bin/clang++" >> "$GITHUB_ENV"

      - name: Show tool versions
        run: |
          set -euo pipefail
          sw_vers | tee /tmp/z7-sw-vers.txt
          xcodebuild -version | tee /tmp/z7-xcode-version.txt
          sdk_version="$(xcrun --show-sdk-version)"
          echo "macOS SDK $sdk_version"
          cmake --version
          ninja --version
          clang --version
          7zz i
          xcodegen --version
          qmake -v | tee /tmp/z7-qmake-version.txt

          grep -q "ProductVersion:[[:space:]]*26\\." /tmp/z7-sw-vers.txt
          grep -q "Xcode 26\\.3" /tmp/z7-xcode-version.txt
          test "$sdk_version" = "26.2"
          grep -q "Using Qt version 6\\.11\\.1" /tmp/z7-qmake-version.txt

      - name: Configure release
        run: |
          set -euo pipefail
          cmake --preset release -DZ7_QT_ROOT="$QT_ROOT"

      - name: Build deploy app
        run: |
          set -euo pipefail
          cmake --build --preset release --target deploy_macos --parallel

      - name: Build macOS integration extensions
        run: |
          set -euo pipefail
          bash src/macos_integration/xcode_project/scripts/build.sh release

      - name: Copy extensions into deploy app
        run: |
          set -euo pipefail
          bash packaging/macos/copy_xcode_extensions.sh

          test -d build/release/deploy/7zFM.app/Contents/PlugIns/MacOSIntegrationFinderSyncExtension.appex
          test -d build/release/deploy/7zFM.app/Contents/PlugIns/MacOSIntegrationQuickLookExtension.appex
          codesign --verify --deep --strict build/release/deploy/7zFM.app

      - name: Package release app with extensions
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="$GITHUB_WORKSPACE/dist/7zqt-macos.arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent build/release/deploy/7zFM.app "$archive"

          verify_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/z7fm-artifact.XXXXXX")"
          trap 'rm -rf "$verify_dir"' EXIT
          ditto -x -k "$archive" "$verify_dir"
          test -L "$verify_dir/7zFM.app/Contents/Frameworks/QtGui.framework/QtGui"
          test -L "$verify_dir/7zFM.app/Contents/Frameworks/QtGui.framework/Versions/Current"
          codesign --verify --deep --strict "$verify_dir/7zFM.app"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 7zFM-macos-release-${{ env.RELEASE_TAG }}
          path: |
            dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          title="7zFM Qt Edition ${RELEASE_TAG}"
          notes="Automated macOS release build from ${GITHUB_SHA}."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$title" \
              --notes "$notes"
            gh release upload "$RELEASE_TAG" dist/*.zip --clobber
            exit 0
          fi

          create_args=(
            release create "$RELEASE_TAG"
            dist/*.zip
            --title "$title"
            --notes "$notes"
          )

          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            create_args+=(--target "$GITHUB_SHA")
          fi

          if [ "$PRERELEASE" = "true" ]; then
            create_args+=(--prerelease)
          fi

          gh "${create_args[@]}"
